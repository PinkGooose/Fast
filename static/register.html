<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <a href="/">Главная</a>
        <a href="/static/register.html">Регистрация</a>
        <a href="login.html">Вход</a>
        <a href="profile.html" id="profile-link" style="display: none;">Профиль</a>
        <a href="#" id="logout-link" style="display: none;">Выход</a>
    </nav>
    <div class="container">
        <h2>Регистрация нового пользователя</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="full_name">Полное имя (необязательно):</label>
                <input type="text" id="full_name" name="full_name">
            </div>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div id="message"></div>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
